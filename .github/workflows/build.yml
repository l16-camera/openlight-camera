name: Build Light Camera APK

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute CalVer version
        id: calver
        run: |
          bash .github/scripts/calver.sh
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t openlight-decomp-tools:latest .

      - name: Download libraries
        run: bash download-libs.sh

      - name: Check orphan smali
        run: bash scripts/check-orphan-smali.sh

      - name: Build APK
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD":/workspace -w /workspace \
            openlight-decomp-tools:latest \
            -c "make clean apk"

      - name: Sign APK
        if: ${{ env.SIGNING_KEY_EXISTS == 'true' }}
        uses: ookami125/apksigner-android@v1
        with:
          releaseDirectory: build
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          customArgs: --v1-signing-enabled,true,--v2-signing-enabled,true
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare versioned artifact
        run: |
          VERSION="${{ steps.calver.outputs.version_name }}"
          cp build/openlight_camera.apk "build/openlight_camera-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openlight_camera-${{ steps.calver.outputs.version_name }}
          path: build/openlight_camera-${{ steps.calver.outputs.version_name }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: openlight-camera ${{ steps.calver.outputs.version_name }}
          files: build/openlight_camera-${{ steps.calver.outputs.version_name }}.apk
          generate_release_notes: true
